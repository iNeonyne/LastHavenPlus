version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      android-and-gradle:
        patterns:
          - "androidx.*"
          - "com.android.*"
          - "org.jetbrains.kotlin*"
          - "org.mozilla.geckoview*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
