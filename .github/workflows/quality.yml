name: Android quality gate

on:
  push:
    branches: [beta]
    paths:
      - "app/src/**"
      - "app/build.gradle.kts"
      - "app/proguard-rules.pro"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
      - ".github/scripts/**"
      - ".github/workflows/quality.yml"
permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Post-merge Android lint and Kotlin formatting
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out source and history for incremental formatting
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android SDK components
        run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0"

      - name: Set up Gradle Wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          validate-wrappers: true

      - name: Run Android Lint and Kotlin formatting check
        env:
          SPOTLESS_RATCHET_REF: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ ! "$SPOTLESS_RATCHET_REF" =~ ^[0-9a-f]{40}$ ]] || [[ "$SPOTLESS_RATCHET_REF" =~ ^0{40}$ ]]; then
            echo "::error::Could not determine a valid formatting baseline commit."
            exit 1
          fi
          ./gradlew lintDebug spotlessCheck --stacktrace \
            -PspotlessRatchetFrom="$SPOTLESS_RATCHET_REF"

      - name: Upload actionable lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-${{ github.run_number }}
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.sarif
            app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 14
