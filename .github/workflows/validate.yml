name: Validate LastHavenPlus

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/**"
      - "scripts/**"
      - "tests/**"
      - "gradle/**"
      - ".github/workflows/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "package.json"
  pull_request:
    paths:
      - "app/**"
      - "scripts/**"
      - "tests/**"
      - "gradle/**"
      - ".github/workflows/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lasthavenplus-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Guard against direct JavaScript-to-native bridges
        run: python3 tests/test_native_bridge_guard.py && python3 scripts/check_native_bridge_exposure.py && python3 tests/test_no_gecko.py

      - name: Test Addon Manager logic and archive handling
        run: npm run test:addon-manager

      - name: Test main update metadata generation
        run: python3 tests/test_update_metadata.py

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 17 SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --channel=3 --install "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.2"

      - name: Validate native WebView loader assets
        run: |
          node --check app/src/main/assets/webview-game-bridge.js
          node --check app/src/main/assets/extensions/lh-addon-manager/overlay.js
          node --check app/src/main/assets/extensions/lh-addon-manager/inject.js

      - name: Test Android code
        run: gradle --no-daemon :app:testDebugUnitTest
