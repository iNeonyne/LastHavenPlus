name: Temporary updater formatter

on:
  push:
    branches: [chaty/issue-4-interrupted-download-tests]
    paths:
      - "app/src/**/*.kt"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          validate-wrappers: true
      - name: Fetch beta formatting baseline
        run: git fetch --no-tags --depth=1 origin beta
      - name: Apply repository Kotlin formatter
        run: ./gradlew spotlessApply -PspotlessRatchetFrom=origin/beta
      - name: Commit formatter output to this feature branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src
          git commit -m "style(updater): apply repository Kotlin formatter"
          git push origin "HEAD:${GITHUB_REF_NAME}"
