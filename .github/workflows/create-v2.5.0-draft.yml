name: Create v2.5.0 draft release

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
  push:
    branches: [beta]
    paths:
      - ".github/workflows/create-v2.5.0-draft.yml"

permissions:
  contents: write

concurrency:
  group: create-v2.5.0-draft
  cancel-in-progress: false

jobs:
  create-draft:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    name: Create or update v2.5.0 draft
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release from beta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v2.5.0"
          notes_file="$RUNNER_TEMP/release-notes.md"
          cat > "$notes_file" <<'NOTES'
          ## What's new

          - **Addon Manager Phase B:** integrated addon management into the in-game overlay while preserving the active GeckoSession.
          - **Safer addon imports:** staged import feedback, explicit replacement confirmation listing affected folders, and cancellation before library changes.
          - **Clearer reload behavior:** addon library changes refresh the bridge snapshot and display a reload-required notice; the notice clears only after a successful refresh.
          - **Improved navigation:** allow HTTPS on `lasthavens.com` and its subdomains, with both default and alternate servers launching at `/play`.
          - **Updater feedback:** clearer progress, retry, and fallback status reporting.

          ## Compatibility

          - Android 10 and newer
          - ARM64 devices
          - GeckoView 160

          ## Known limitations

          - Addon enabled state is a saved local preference; runtime activation has not yet been verified.
          - Physical-device and in-game Lua addon initialization testing has not been completed.
          - Reloading the game is required after addon library changes before the updated addon state is reflected in the running session.
          NOTES

          if existing="$(gh release view "$tag" --json isDraft,url 2>/dev/null)"; then
            is_draft="$(jq -r '.isDraft' <<< "$existing")"
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::Release $tag already exists and is published; refusing to modify it."
              exit 1
            fi
            gh release edit "$tag" --title "LastHavenPlus v2.5.0 — Addon Manager Phase B" --notes-file "$notes_file"
            echo "Updated existing draft release $tag."
          else
            gh release create "$tag" --draft --target beta --title "LastHavenPlus v2.5.0 — Addon Manager Phase B" --notes-file "$notes_file"
            echo "Created draft release $tag."
          fi
