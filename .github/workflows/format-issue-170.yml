name: One-time PR 226 formatter

on:
  push:
    branches:
      - chaty/addon-manager-phase-b-170
    paths:
      - .github/workflows/format-issue-170.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out formatting branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          gradle-version: wrapper
          validate-wrappers: true

      - name: Apply Spotless to PR files only
        run: |
          git fetch --no-tags origin beta
          ./gradlew spotlessApply -PspotlessRatchetFrom=origin/beta
          for path in $(git diff --name-only); do
            case "$path" in
              app/src/main/java/com/neonyne/lasthavenlauncher/AddonArchive.kt|app/src/main/java/com/neonyne/lasthavenlauncher/AddonLibraryRepository.kt|app/src/main/java/com/neonyne/lasthavenlauncher/AddonManagerScreen.kt|app/src/test/java/com/neonyne/lasthavenlauncher/AddonManagerIntegrationTest.kt)
                ;;
              *)
                git checkout -- "$path"
                ;;
            esac
          done
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/neonyne/lasthavenlauncher/AddonArchive.kt app/src/main/java/com/neonyne/lasthavenlauncher/AddonLibraryRepository.kt app/src/main/java/com/neonyne/lasthavenlauncher/AddonManagerScreen.kt app/src/test/java/com/neonyne/lasthavenlauncher/AddonManagerIntegrationTest.kt
            git commit -m "style: apply Spotless formatting to Addon Manager changes"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
