name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lasthavens-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 17 SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --channel=3 --install "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare signing key (optional)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Validate release metadata
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          app = pathlib.Path("app/build.gradle.kts").read_text()
          readme = pathlib.Path("README.md").read_text()
          props = pathlib.Path("gradle.properties").read_text()
          manifest = json.loads(pathlib.Path("app/src/main/assets/extensions/lh-addon-manager/manifest.json").read_text())
          version = re.search(r'val appVersionName = "([^"]+)"', app).group(1)
          code = int(re.search(r'val appVersionCode = (\d+)', app).group(1))
          engine = re.search(r'^geckoViewVersion=(.+)        run: |
          EXT="app/src/main/assets/extensions/lh-addon-manager"
          python3 - "$EXT" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          files = list(root.rglob("*.json"))
          for path in files:
              json.loads(path.read_text(encoding="utf-8"))
          if not (root / "manifest.json").is_file():
              raise SystemExit("Addon Manager manifest.json is missing")
          if not (root / "_locales" / "en" / "messages.json").is_file():
              raise SystemExit("English extension locale is missing")
          print(f"Validated {len(files)} JSON files")
          PY
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done < <(find "$EXT" -type f -name '*.js' -print0)

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify packaged app assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          output_dir = Path("app/build/outputs/apk/release")
          apks = sorted(output_dir.glob("*.apk"))
          expected = {"arm64-v8a", "armeabi-v7a", "x86_64", "universal"}
          if not apks:
              raise SystemExit("Gradle produced no release APKs")

          found = set()
          for apk in apks:
              name = apk.name.lower()
              variant = next((abi for abi in expected if abi in name), None)
              if variant is None:
                  raise SystemExit(f"Unexpected APK output name: {apk.name}")
              found.add(variant)
              with zipfile.ZipFile(apk) as archive:
                  contents = set(archive.namelist())
              required = {
                  "assets/extensions/lh-addon-manager/manifest.json",
                  "assets/extensions/lh-addon-manager/_locales/en/messages.json",
              }
              if variant == "universal":
                  required.update({
                      "lib/arm64-v8a/libxul.so",
                      "lib/armeabi-v7a/libxul.so",
                      "lib/x86_64/libxul.so",
                  })
              else:
                  required.add(f"lib/{variant}/libxul.so")
              missing = sorted(required - contents)
              if missing:
                  raise SystemExit(f"{apk.name} is missing: " + ", ".join(missing))
              print(f"Verified {apk.name} ({apk.stat().st_size:,} bytes)")

          missing_variants = sorted(expected - found)
          if missing_variants:
              raise SystemExit("Missing ABI APK variants: " + ", ".join(missing_variants))
          PY

      - name: Name the APKs
        run: |
          VERSION=$(grep -m1 'val appVersionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\\1/')
          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            filename=$(basename "$apk")
            variant="${filename#app-}"
            variant="${variant%-release.apk}"
            cp "$apk" "dist/Lasthavens-$VERSION-$variant.apk"
          done
          test "$(find dist -maxdepth 1 -name '*.apk' | wc -l)" -eq 4
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Lasthavens-APKs
          path: dist/*.apk

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
, props, re.M).group(1).strip()
          if f"| `{version}` |" not in readme:
              raise SystemExit(f"README current-version table is missing app version {version}")
          if f"| `{manifest['version']}` |" not in readme:
              raise SystemExit(f"README current-version table is missing Addon Manager version {manifest['version']}")
          if f"| `{engine}` |" not in readme:
              raise SystemExit(f"README current-version table is missing GeckoView version {engine}")
          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/v") and ref.removeprefix("refs/tags/v") != version:
              raise SystemExit(f"Release tag {ref} does not match appVersionName {version}")
          print(f"Release metadata OK: app {version} (code {code}), manager {manifest['version']}, GeckoView {engine}")
          PY

      - name: Validate bundled Addon Manager
        run: |
          EXT="app/src/main/assets/extensions/lh-addon-manager"
          python3 - "$EXT" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          files = list(root.rglob("*.json"))
          for path in files:
              json.loads(path.read_text(encoding="utf-8"))
          if not (root / "manifest.json").is_file():
              raise SystemExit("Addon Manager manifest.json is missing")
          if not (root / "_locales" / "en" / "messages.json").is_file():
              raise SystemExit("English extension locale is missing")
          print(f"Validated {len(files)} JSON files")
          PY
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done < <(find "$EXT" -type f -name '*.js' -print0)

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify packaged app assets
        run: |
          python3 - <<'PY'
          import glob, os, zipfile
          apks = sorted(glob.glob("app/build/outputs/apk/release/*.apk"))
          if not apks:
              raise SystemExit("No release APKs were generated")
          common = [
              "assets/extensions/lh-addon-manager/manifest.json",
              "assets/extensions/lh-addon-manager/_locales/en/messages.json",
          ]
          for apk in apks:
              name = os.path.basename(apk)
              abi = name.removeprefix("app-").removesuffix("-release.apk")
              with zipfile.ZipFile(apk) as archive:
                  entries = set(archive.namelist())
              missing = [path for path in common if path not in entries]
              expected_abis = ("arm64-v8a", "armeabi-v7a", "x86_64") if abi == "universal" else (abi,)
              missing.extend(f"lib/{item}/libxul.so" for item in expected_abis if f"lib/{item}/libxul.so" not in entries)
              if missing:
                  raise SystemExit(f"{name} is missing required content: {', '.join(missing)}")
              print(f"Verified {name} ({os.path.getsize(apk):,} bytes)")
          PY

      - name: Name ABI-specific APKs
        run: |
          VERSION=$(grep -m1 'val appVersionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          mkdir -p dist
          shopt -s nullglob
          APK_FILES=(app/build/outputs/apk/release/*.apk)
          if [ ${#APK_FILES[@]} -eq 0 ]; then
            echo "No release APKs were generated" >&2
            exit 1
          fi
          for apk in "${APK_FILES[@]}"; do
            ABI=$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$apk" "dist/Lasthavens-$VERSION-$ABI.apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Lasthavens-APKs
          path: dist/*.apk

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
