name: Build LastHavenPlus APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/**"
      - "scripts/**"
      - "tests/**"
      - "gradle/**"
      - ".github/workflows/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "package.json"
  pull_request:
    paths:
      - "app/**"
      - "scripts/**"
      - "tests/**"
      - "gradle/**"
      - ".github/workflows/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lasthavenplus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Guard against direct JavaScript-to-native bridges
        run: python3 tests/test_native_bridge_guard.py && python3 scripts/check_native_bridge_exposure.py && python3 tests/test_no_gecko.py

      - name: Validate release tag and main ancestry
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          tag = os.environ["RELEASE_TAG"]
          app = pathlib.Path("app/build.gradle.kts").read_text()
          match = re.search(r'val appVersionName = "([^"]+)"', app)
          if not match:
              raise SystemExit("Could not read appVersionName from app/build.gradle.kts")
          version = match.group(1)
          if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag):
              raise SystemExit(f"Release tag must be stable vMAJOR.MINOR.PATCH (got {tag})")
          if tag != f"v{version}":
              raise SystemExit(f"Release tag {tag} does not match appVersionName {version}")
          print(f"Validated stable release tag {tag}")
          PY
          git fetch --no-tags --unshallow origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || {
            echo "Release tag must point to a commit already reachable from main."
            exit 1
          }

      - name: Test Addon Manager logic and archive handling
        run: npm run test:addon-manager

      - name: Test main update metadata generation
        run: python3 tests/test_update_metadata.py

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 17 SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --channel=3 --install "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.2"

      - name: Prepare signing key (main builds and tagged releases only)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: B3BBF7520E77DFC384A60B1EEE6C5F205B978F9B453849E2BE523F642018D263
        run: |
          for name in KS KS_PASSWORD ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub Actions signing secret: $name"
              exit 1
            fi
          done
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"
          fingerprint=$(keytool -exportcert -keystore "$RUNNER_TEMP/release.jks" -storepass "$KS_PASSWORD" -alias "$ALIAS" | sha256sum | awk '{print toupper($1)}')
          echo "Configured signing certificate SHA-256: $fingerprint"
          echo "Expected signing certificate SHA-256:  $EXPECTED_CERT_SHA256"
          if [ "$fingerprint" != "$EXPECTED_CERT_SHA256" ]; then
            echo "The configured keystore certificate does not match the expected Lasthavens release key."
            exit 1
          fi
          echo "Release keystore fingerprint matches the expected certificate."
          keytool -certreq -alias "$ALIAS" -keystore "$RUNNER_TEMP/release.jks" -storepass "$KS_PASSWORD" -keypass "$KEY_PASSWORD" -file "$RUNNER_TEMP/signing-key-check.csr" >/dev/null
          rm -f "$RUNNER_TEMP/signing-key-check.csr"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Explain beta/demo signing mode
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')
        run: echo "Building a debug-signed demo APK; release signing is only required for version tags."

      - name: Validate release metadata
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          app = pathlib.Path("app/build.gradle.kts").read_text()
          version = re.search(r'val appVersionName = "([^"]+)"', app).group(1)
          code = int(os.environ["GITHUB_RUN_NUMBER"])
          if code <= 2:
              raise SystemExit(f"CI versionCode {code} must exceed legacy code 2")
          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/v"):
              tag = ref.removeprefix("refs/tags/")
              parts = tag.removeprefix("v").split(".")
              stable = len(parts) == 3 and all(part.isdigit() and (part == "0" or not part.startswith("0")) for part in parts)
              if tag != f"v{version}" or not stable:
                  raise SystemExit(f"Release tag {tag} must be stable and match appVersionName {version}")
          print(f"Build metadata OK: app {version} (versionCode {code}); Android System WebView is device-provided.")
          PY

      - name: Validate native WebView loader assets
        run: |
          python3 tests/test_no_gecko.py
          node --check app/src/main/assets/webview-game-bridge.js
          node --check app/src/main/assets/extensions/lh-addon-manager/overlay.js
          node --check app/src/main/assets/extensions/lh-addon-manager/inject.js

      - name: Test Android code and build release APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Verify APK signatures
        run: |
          set -euo pipefail
          expected=""
          for apk in app/build/outputs/apk/release/*.apk; do
            APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
            test -x "$APKSIGNER" || { echo "apksigner not found at $APKSIGNER"; exit 1; }
            output=$("$APKSIGNER" verify --verbose --print-certs "$apk")
            echo "$output"
            cert=$(printf '%s\n' "$output" | sed -nE 's/^(V[0-9.]+ )?Signer( #[0-9]+)?: certificate SHA-256 digest: //p' | head -n1)
            [ -n "$cert" ] || { echo "Could not read signer certificate from $apk"; exit 1; }
            if [ "$GITHUB_REF" = "refs/heads/main" ] || [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              normalized_cert=$(printf '%s' "$cert" | tr -d ':' | tr '[:lower:]' '[:upper:]')
              if [ "$normalized_cert" != "B3BBF7520E77DFC384A60B1EEE6C5F205B978F9B453849E2BE523F642018D263" ]; then
                echo "APK signer fingerprint does not match the expected Lasthavens release key."
                exit 1
              fi
              if printf '%s' "$output" | grep -qi 'CN=Android Debug'; then
                echo "Refusing to accept a debug-signed APK in a trusted build"
                exit 1
              fi
            fi
            if [ -z "$expected" ]; then
              expected="$cert"
            elif [ "$cert" != "$expected" ]; then
              echo "APK variants were signed with different certificates"
              exit 1
            fi
          done

      - name: Verify packaged app assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          output_dir = Path("app/build/outputs/apk/release")
          apks = sorted(output_dir.glob("*.apk"))
          expected = {"arm64-v8a"}
          if not apks:
              raise SystemExit("Gradle produced no release APKs")

          found = set()
          for apk in apks:
              name = apk.name.lower()
              variant = next((abi for abi in expected if name == f"app-{abi}-release.apk"), None)
              if variant is None:
                  raise SystemExit(f"Unexpected APK output name: {apk.name}")
              found.add(variant)
              with zipfile.ZipFile(apk) as archive:
                  contents = set(archive.namelist())
              required = {
                  "assets/webview-game-bridge.js",
                  "assets/extensions/lh-addon-manager/overlay.js",
                  "assets/extensions/lh-addon-manager/inject.js",
              }
              missing = sorted(required - contents)
              if missing:
                  raise SystemExit(f"{apk.name} is missing: " + ", ".join(missing))
              forbidden = sorted(
                  path for path in contents
                  if path.endswith("/libxul.so") or "org/mozilla/geckoview" in path.lower()
                  or path.startswith("assets/extensions/lh-addon-manager/") and path not in {
                      "assets/extensions/lh-addon-manager/overlay.js",
                      "assets/extensions/lh-addon-manager/inject.js",
                  }
              )
              if forbidden:
                  raise SystemExit(f"{apk.name} still packages Gecko/extension runtime assets: " + ", ".join(forbidden[:20]))
              print(f"Verified Gecko-free {apk.name} ({apk.stat().st_size:,} bytes)")

          missing_variants = sorted(expected - found)
          if missing_variants:
              raise SystemExit("Missing ABI APK variants: " + ", ".join(missing_variants))
          PY

      - name: Verify APK package and version metadata
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          root = pathlib.Path("app/build/outputs/apk/release")
          apks = sorted(root.glob("*.apk"))
          app = pathlib.Path("app/build.gradle.kts").read_text()
          expected_name = re.search(r'val appVersionName = "([^"]+)"', app).group(1)
          expected_apk = "app-arm64-v8a-release.apk"
          if len(apks) != 1 or apks[0].name != expected_apk:
              raise SystemExit(f"Expected exactly one ARM64 APK ({expected_apk}), found {[apk.name for apk in apks]}")
          expected_code = int(os.environ["GITHUB_RUN_NUMBER"])
          aapt = pathlib.Path(os.environ["ANDROID_HOME"]) / "build-tools" / "37.0.0" / "aapt"
          if not aapt.is_file():
              raise SystemExit(f"Android aapt not found: {aapt}")
          pattern = re.compile(r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']*)'", re.M)
          for apk in apks:
              output = subprocess.check_output([str(aapt), "dump", "badging", str(apk)], text=True)
              match = pattern.search(output)
              if not match:
                  raise SystemExit(f"Could not read package metadata from {apk.name}")
              package_id, version_code, version_name = match.groups()
              if package_id != "com.lasthavens.android":
                  raise SystemExit(f"{apk.name} has unexpected package ID {package_id}")
              if int(version_code) != expected_code:
                  raise SystemExit(f"{apk.name} has versionCode {version_code}, expected {expected_code}")
              if version_name != expected_name:
                  raise SystemExit(f"{apk.name} has versionName {version_name}, expected {expected_name}")
              print(f"Verified {apk.name}: {package_id} {version_name} ({version_code})")
          PY

      - name: Name ABI-specific APKs
        run: |
          VERSION=$(grep -m1 'val appVersionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            filename=$(basename "$apk")
            variant="${filename#app-}"
            variant="${variant%-release.apk}"
            cp "$apk" "dist/LastHavenPlus-$VERSION-$variant.apk"
          done
          test "$(find dist -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
          ls -lh dist/

      - name: Generate and verify APK checksums
        run: |
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Create main update metadata
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          WORKFLOW_ID: 427170801
        run: python3 scripts/create_update_metadata.py

      - name: Upload main update metadata
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: LastHavenPlus-Main-Update-Metadata
          path: |
            dist/update.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Upload main ARM64 update APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: LastHavenPlus-Main-Update-arm64-v8a
          path: dist/LastHavenPlus-*-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Upload beta and tagged APK bundle
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/v') && 'LastHavenPlus-APKs' || 'LastHavenPlus-Demo-APKs' }}
          path: dist/*
          retention-days: 90
          overwrite: true

      - name: Upload beta/tag ARM64 APK
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/v') && 'LastHavenPlus-ARM64' || 'LastHavenPlus-Demo-ARM64' }}
          path: dist/LastHavenPlus-*-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: LastHavenPlus ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
