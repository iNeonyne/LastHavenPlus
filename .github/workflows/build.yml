name: Build LastHavenPlus APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lasthavenplus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 17 SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --channel=3 --install "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            for name in KS KS_PASSWORD ALIAS KEY_PASSWORD; do
              if [ -z "${!name}" ]; then
                echo "Missing required GitHub Actions secret for stable release signing: $name"
                exit 1
              fi
            done
          fi
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            test -s "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Validate release metadata
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          app = pathlib.Path("app/build.gradle.kts").read_text()
          readme = pathlib.Path("README.md").read_text()
          props = pathlib.Path("gradle.properties").read_text()
          manifest = json.loads(pathlib.Path("app/src/main/assets/extensions/lh-addon-manager/manifest.json").read_text())
          version = re.search(r'val appVersionName = "([^"]+)"', app).group(1)
          code = int(re.search(r'val appVersionCode = (\d+)', app).group(1))
          engine = re.search(r'^geckoViewVersion=(.+)$', props, re.M).group(1).strip()
          for value, label in ((version, "app"), (manifest["version"], "Addon Manager"), (engine, "GeckoView")):
              if f"| {chr(96)}{value}{chr(96)} |" not in readme:
                  raise SystemExit(f"README current-version table is missing {label} version {value}")
          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/v") and ref.removeprefix("refs/tags/v") != version:
              raise SystemExit(f"Release tag {ref} does not match appVersionName {version}")
          print(f"Release metadata OK: app {version} (code {code}), manager {manifest['version']}, GeckoView {engine}")
          PY

      - name: Validate bundled Addon Manager
        run: |
          EXT="app/src/main/assets/extensions/lh-addon-manager"
          python3 - "$EXT" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          files = list(root.rglob("*.json"))
          for path in files:
              json.loads(path.read_text(encoding="utf-8"))
          if not (root / "manifest.json").is_file():
              raise SystemExit("Addon Manager manifest.json is missing")
          if not (root / "_locales" / "en" / "messages.json").is_file():
              raise SystemExit("English extension locale is missing")
          print(f"Validated {len(files)} JSON files")
          PY
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done < <(find "$EXT" -type f -name '*.js' -print0)

      - name: Build release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK signatures
        run: |
          set -euo pipefail
          expected=""
          for apk in app/build/outputs/apk/release/*.apk; do
            APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
            test -x "$APKSIGNER" || { echo "apksigner not found at $APKSIGNER"; exit 1; }
            output=$("$APKSIGNER" verify --verbose --print-certs "$apk")
            echo "$output"
            cert=$(printf '%s\n' "$output" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)
            [ -n "$cert" ] || { echo "Could not read signer certificate from $apk"; exit 1; }
            if [ -z "$expected" ]; then
              expected="$cert"
            elif [ "$cert" != "$expected" ]; then
              echo "APK variants were signed with different certificates"
              exit 1
            fi
            if [[ "$GITHUB_REF" == refs/tags/v* ]] && printf '%s' "$output" | grep -qi 'CN=Android Debug'; then
              echo "Refusing to publish a debug-signed APK"
              exit 1
            fi
          done

      - name: Verify packaged app assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          output_dir = Path("app/build/outputs/apk/release")
          apks = sorted(output_dir.glob("*.apk"))
          expected = {"arm64-v8a", "armeabi-v7a", "x86_64", "universal"}
          if not apks:
              raise SystemExit("Gradle produced no release APKs")

          found = set()
          for apk in apks:
              name = apk.name.lower()
              variant = next((abi for abi in expected if name == f"app-{abi}-release.apk"), None)
              if variant is None:
                  raise SystemExit(f"Unexpected APK output name: {apk.name}")
              found.add(variant)
              with zipfile.ZipFile(apk) as archive:
                  contents = set(archive.namelist())
              required = {
                  "assets/extensions/lh-addon-manager/manifest.json",
                  "assets/extensions/lh-addon-manager/_locales/en/messages.json",
              }
              if variant == "universal":
                  required.update({
                      "lib/arm64-v8a/libxul.so",
                      "lib/armeabi-v7a/libxul.so",
                      "lib/x86_64/libxul.so",
                  })
              else:
                  required.add(f"lib/{variant}/libxul.so")
              missing = sorted(required - contents)
              if missing:
                  raise SystemExit(f"{apk.name} is missing: " + ", ".join(missing))
              print(f"Verified {apk.name} ({apk.stat().st_size:,} bytes)")

          missing_variants = sorted(expected - found)
          if missing_variants:
              raise SystemExit("Missing ABI APK variants: " + ", ".join(missing_variants))
          PY

      - name: Name ABI-specific APKs
        run: |
          VERSION=$(grep -m1 'val appVersionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            filename=$(basename "$apk")
            variant="${filename#app-}"
            variant="${variant%-release.apk}"
            cp "$apk" "dist/LastHavenPlus-$VERSION-$variant.apk"
          done
          test "$(find dist -maxdepth 1 -name '*.apk' | wc -l)" -eq 4
          ls -lh dist/

      - name: Generate and verify APK checksums
        run: |
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: LastHavenPlus-APKs
          path: dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: LastHavenPlus-ARM64
          path: dist/LastHavenPlus-*-arm64-v8a.apk
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
