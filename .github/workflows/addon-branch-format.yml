name: Temporary addon branch formatter

on:
  push:
    branches: [chaty/addon-manager-native-phase-a]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out addon branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          gradle-version: wrapper
          validate-wrappers: true
      - name: Apply repository Kotlin formatter
        run: ./gradlew spotlessApply
      - name: Commit formatting changes on this task branch
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src
            git commit -m "style(addons): apply repository Kotlin formatting"
            git push origin HEAD
          fi
