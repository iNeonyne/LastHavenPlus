name: Release promotion PR validation (read-only)

on:
  push:
    branches:
      - "chaty/release-v2.4.0-selective-promotion"

# This workflow validates the selective stable-promotion branch without
# exposing release secrets, signing keys, or write permissions.
permissions:
  contents: read

concurrency:
  group: release-promotion-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, unsigned release build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out exact pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android 37.2 platform
        run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0"

      - name: Set up Gradle Wrapper
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: wrapper
          validate-wrappers: true

      - name: Fetch beta formatting baseline
        run: git fetch --no-tags --depth=1 origin beta

      - name: Test release and reproducibility helpers
        run: |
          python3 -m unittest discover -s .github/scripts/tests -v
          python3 -m unittest discover -s .github/scripts/reproducible/tests -v
          bash -n .github/scripts/prepare_release_payload.sh

      - name: Run lint, formatting, unsigned release build and unit tests
        run: ./gradlew lintDebug spotlessCheck assembleRelease testDebugUnitTest --stacktrace -PspotlessRatchetFrom=origin/beta

      - name: Verify Addon Manager MIT notice in unsigned APK
        run: |
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned.apk' -print -quit)"
          test -n "$apk"
          unzip -Z1 "$apk" | grep -Fx "assets/licenses/ADDON_MANAGER_0.5.1_MIT.txt"
