name: Agent issue ownership

on:
  issues:
    types: [opened, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      backfill_existing:
        description: "Apply missing ownership labels and validate existing open issues (beta only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ownership:
    name: Validate single issue owner
    if: github.event_name == 'issues' || github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Ensure labels and validate ownership
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BACKFILL: ${{ inputs.backfill_existing }}
        shell: bash
        run: |
          set -euo pipefail

          OWNER_LABELS=(
            "agent:unassigned"
            "agent:chaty"
            "agent:vibe"
            "agent:ib"
            "agent:review"
            "agent:owner"
          )

          ensure_label() {
            local name="$1"
            local color="$2"
            local description="$3"
            if ! gh api --paginate "repos/$GITHUB_REPOSITORY/labels?per_page=100" --jq '.[].name' | grep -Fx "$name" >/dev/null; then
              # Two simultaneous issue events can race to create the same label.
              if ! gh api --method POST "repos/$GITHUB_REPOSITORY/labels" \
                -f "name=$name" -f "color=$color" -f "description=$description" >/dev/null; then
                if ! gh api --paginate "repos/$GITHUB_REPOSITORY/labels?per_page=100" --jq '.[].name' | grep -Fx "$name" >/dev/null; then
                  echo "::error::Could not create or find label: $name"
                  return 1
                fi
              fi
            fi
          }

          ensure_label "agent:unassigned" "f9d0c4" "No active implementation owner; Chaty must triage and record the next step."
          ensure_label "agent:chaty" "0052cc" "Owned or coordinated by Chaty."
          ensure_label "agent:vibe" "5319e7" "Explicitly assigned to Vibe; implementation may start within scope."
          ensure_label "agent:ib" "1d76db" "Explicitly assigned to IB; implementation may start within scope."
          ensure_label "agent:review" "fbca04" "Submitted for Chaty's review and integration."
          ensure_label "agent:owner" "0e8a16" "Waiting for a repository-owner decision."
          ensure_label "agent:blocked" "d93f0b" "Historical closure marker for issues closed without successful merging."

          validate_issue() {
            local number="$1"
            local state labels count blocked_count label
            state="$(gh api "repos/$GITHUB_REPOSITORY/issues/$number" --jq '.state')"
            if [[ "$state" != "open" ]]; then
              echo "Issue #$number is closed; active owner validation is not applicable."
              return 0
            fi

            labels="$(gh api "repos/$GITHUB_REPOSITORY/issues/$number" --jq '[.labels[].name]')"
            count="$(jq --argjson owners "$(printf '%s\n' "${OWNER_LABELS[@]}" | jq -R . | jq -s .)" '[.[] | select(. as $name | $owners | index($name))] | length' <<<"$labels")"
            blocked_count="$(jq '[.[] | select(. == "agent:blocked")] | length' <<<"$labels")"

            if [[ "$blocked_count" -gt 0 ]]; then
              echo "::error::Open issue #$number uses agent:blocked. Open waiting issues must retain their actual owner label; agent:blocked is a closed-issue marker."
              return 1
            fi
            if [[ "$count" -ne 1 ]]; then
              echo "::error::Open issue #$number has $count active agent owner labels; exactly one is required. Labels: $labels"
              return 1
            fi

            echo "Issue #$number has one permitted active owner."
          }

          add_unassigned_if_missing() {
            local number="$1"
            local count
            count="$(gh api "repos/$GITHUB_REPOSITORY/issues/$number" --jq '[.labels[].name | select(. as $name | ["agent:unassigned","agent:chaty","agent:vibe","agent:ib","agent:review","agent:owner"] | index($name))] | length')"
            if [[ "$count" -eq 0 ]]; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$number/labels" \
                --raw-field "labels[]=agent:unassigned" >/dev/null
              echo "Issue #$number -> agent:unassigned"
            fi
            validate_issue "$number"
          }

          if [[ "$EVENT_NAME" == "issues" ]]; then
            if [[ "$EVENT_ACTION" == "opened" || "$EVENT_ACTION" == "reopened" ]]; then
              add_unassigned_if_missing "$ISSUE_NUMBER"
            else
              # On label changes, validate the final issue state. Never remove/replace labels
              # automatically: ownership changes are Chaty's responsibility.
              validate_issue "$ISSUE_NUMBER"
            fi
            exit 0
          fi

          if [[ "$BACKFILL" != "true" ]]; then
            echo "Ownership labels ensured. Backfill was not requested."
            exit 0
          fi

          # Backfill never assigns by issue number and never overwrites existing labels.
          # Unlabelled open issues enter intake; conflicts fail visibly for Chaty to repair.
          while IFS= read -r number; do
            [[ -n "$number" ]] || continue
            add_unassigned_if_missing "$number"
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null) | .number')
