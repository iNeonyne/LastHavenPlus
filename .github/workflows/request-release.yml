name: Request LastHavenPlus release

on:
  push:
    branches: [main]
    paths:
      - ".github/release-request.json"

permissions:
  contents: write
  actions: write

concurrency:
  group: lasthavenplus-release-request
  cancel-in-progress: false

jobs:
  request-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main and tags
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Validate release request
        id: validate
        env:
          REQUEST_FILE: .github/release-request.json
          REQUEST_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess

          request_path = pathlib.Path(os.environ["REQUEST_FILE"])
          request = json.loads(request_path.read_text(encoding="utf-8"))
          if set(request) != {"version", "dry_run"}:
              raise SystemExit("Request must contain exactly: version, dry_run")
          version = request["version"]
          dry_run = request["dry_run"]
          if not isinstance(version, str) or not re.fullmatch(
              r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version
          ):
              raise SystemExit("version must be stable MAJOR.MINOR.PATCH without a leading v")
          if type(dry_run) is not bool:
              raise SystemExit("dry_run must be true or false")

          gradle = pathlib.Path("app/build.gradle.kts").read_text(encoding="utf-8")
          match = re.search(r'val appVersionName = "([^"]+)"', gradle)
          if not match:
              raise SystemExit("Could not read appVersionName from app/build.gradle.kts")
          if match.group(1) != version:
              raise SystemExit(
                  f"Request version {version} does not match appVersionName {match.group(1)}"
              )

          requested = tuple(map(int, version.split(".")))
          stable_tags = []
          for tag in subprocess.check_output(
              ["git", "tag", "--list", "v*"], text=True
          ).splitlines():
              found = re.fullmatch(
                  r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag
              )
              if found:
                  stable_tags.append((tuple(map(int, found.groups())), tag))

          tag = f"v{version}"
          tag_exists = subprocess.run(
              ["git", "rev-parse", "--verify", f"refs/tags/{tag}"],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          ).returncode == 0

          if tag_exists:
              tagged_commit = subprocess.check_output(
                  ["git", "rev-parse", f"{tag}^{{}}"], text=True
              ).strip()
              if not dry_run and tagged_commit != os.environ["REQUEST_COMMIT"]:
                  raise SystemExit(
                      f"{tag} already exists at {tagged_commit}, not this request commit"
                  )
              if not dry_run and tagged_commit == os.environ["REQUEST_COMMIT"]:
                  print(f"{tag} already points to this commit; retry may continue")
          elif stable_tags and requested <= max(item[0] for item in stable_tags):
              raise SystemExit("Requested version must be greater than every existing stable tag")

          print(f"Validated release request: {tag} (dry_run={str(dry_run).lower()})")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag={tag}\n")
              output.write(f"dry_run={str(dry_run).lower()}\n")
          PY

      - name: Create annotated tag
        if: steps.validate.outputs.dry_run == 'false'
        env:
          TAG: ${{ steps.validate.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            existing=$(git rev-parse "$TAG^{}")
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "$TAG already exists at a different commit ($existing)"
              exit 1
            fi
            echo "$TAG already exists at this commit; continuing with dispatch."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "LastHavenPlus $TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Start signed release build on the new tag
        if: steps.validate.outputs.dry_run == 'false'
        env:
          TAG: ${{ steps.validate.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run 427170801 --ref "$TAG"

      - name: Report dry-run result
        if: steps.validate.outputs.dry_run == 'true'
        env:
          TAG: ${{ steps.validate.outputs.tag }}
        run: echo "Dry run passed for $TAG. No tag or release was created."
