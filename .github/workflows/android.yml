name: LastHavenPlus Android build and signed releases

on:
  push:
    branches: [main, beta]
    tags: ["v*"]
    # Documentation-only edits do not need an Android build. Workflow/config/source
    # changes still run the complete verification pipeline.
    paths-ignore:
      - "*.md"
      - "**/*.md"
  pull_request:
    branches: [beta]
    paths-ignore:
      - "*.md"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version to create (for example 1.0.0). Leave empty for a normal CI build."
        required: false
        type: string

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # PR validation is intentionally read-only and does not access signing secrets
  # or upload/publish APKs. The normal beta push pipeline performs signed checks.
  pull_request_validation:
    if: github.event_name == 'pull_request'
    name: PR build and unit tests (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out PR source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 37.2 platform
        run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0"

      - name: Set up Gradle Wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          validate-wrappers: true

      - name: Test bounded release input helper
        run: python3 -m unittest discover -s .github/scripts/tests -v

      - name: Build unsigned release variant and run unit tests
        run: ./gradlew assembleRelease testDebugUnitTest --stacktrace

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-unit-test-reports-${{ github.event.pull_request.number }}
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

  create_tag:
    name: Create release tag
    if: (github.event_name == 'workflow_dispatch' && inputs.release_version != '' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release:'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_ref: ${{ steps.tag.outputs.tag_ref }}
    steps:
      - name: Validate version and create tag on selected main commit
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version || '' }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_VERSION" && "$COMMIT_MESSAGE" =~ \[release:([0-9]+\.[0-9]+\.[0-9]+)\] ]]; then
            RELEASE_VERSION="${BASH_REMATCH[1]}"
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use MAJOR.MINOR.PATCH, for example 1.0.0."
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$RELEASE_VERSION"
          if (( major > 999 || minor > 999 || patch > 999 )); then
            echo "::error::Each version component must be 999 or lower."
            exit 1
          fi
          tag="v$RELEASE_VERSION"
          if existing_release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" 2>/dev/null)"; then
            is_draft="$(jq -r '.draft' <<< "$existing_release")"
            release_id="$(jq -r '.id' <<< "$existing_release")"
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::A published release already exists for $tag; refusing to replace it."
              exit 1
            fi
            echo "Replacing existing unpublished draft release $tag (release $release_id)."
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id" >/dev/null
          else
            echo "No existing GitHub release for $tag; proceeding."
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f "sha=$GITHUB_SHA" -F "force=true" >/dev/null
            echo "Retargeted unpublished $tag to $GITHUB_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" >/dev/null
            echo "Created $tag at $GITHUB_SHA"
          fi
          echo "tag_ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: create_tag
    if: github.event_name != 'pull_request' && always() && (needs.create_tag.result == 'success' || needs.create_tag.result == 'skipped')
    name: Build and test (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create_tag.outputs.tag_ref || github.ref }}
          # Full history is only needed to validate release-tag ancestry.
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/v') && '0' || '1' }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 37.2 platform
        run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0"

      - name: Set up Gradle Wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          validate-wrappers: true

      - name: Test bounded release input helper
        run: python3 -m unittest discover -s .github/scripts/tests -v

      - name: Validate release tag belongs to stable main history
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Release tags must point to a commit already contained in stable main."
            exit 1
          fi

      - name: Resolve version metadata
        id: version
        shell: bash
        env:
          CREATED_TAG_REF: ${{ needs.create_tag.outputs.tag_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -n "$CREATED_TAG_REF" ]]; then
            tag="${CREATED_TAG_REF#refs/tags/}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag=""
          fi

          if [[ -n "$tag" ]]; then
            version="${tag#v}"
            if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::Release tags must use vMAJOR.MINOR.PATCH."
              exit 1
            fi
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            if (( major > 999 || minor > 999 || patch > 999 )); then
              echo "::error::Each version component must be 999 or lower."
              exit 1
            fi
            version_code=$((major * 1000000 + minor * 1000 + patch))
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == "refs/heads/beta" ]]; then
            # Beta demo APKs must be installable over the latest stable app without
            # lowering versionCode. Reuse the stable identity, but keep this a CI
            # artifact only: is_release remains false, so no tag or release is created.
            stable_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
            if [[ ! "$stable_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::Latest stable release tag is not vMAJOR.MINOR.PATCH."
              exit 1
            fi
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            if (( major > 999 || minor > 999 || patch > 999 )); then
              echo "::error::Each stable version component must be 999 or lower."
              exit 1
            fi
            version="${stable_tag#v}"
            version_code=$((major * 1000000 + minor * 1000 + patch))
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "Using latest stable version identity for beta demo: $version (versionCode $version_code)"
          else
            version="0.1.0"
            version_code="1"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "Building version $version (versionCode $version_code)"

      - name: Restore release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret" >&2; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD secret" >&2; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD secret" >&2; exit 1; }
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/lasthavenplus-release.jks" >> "$GITHUB_ENV"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lasthavenplus-release.jks"
          chmod 600 "$RUNNER_TEMP/lasthavenplus-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/lasthavenplus-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias lasthavenplus >/dev/null

      - name: Build signed optimized release APK and run unit tests
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/lasthavenplus-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          ./gradlew assembleRelease testDebugUnitTest --stacktrace \
            -PappVersionName="$APP_VERSION_NAME" -PappVersionCode="$APP_VERSION_CODE"

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.run_number }}
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify signing certificate, ABI and report APK sizes
        shell: bash
        run: |
          set -euo pipefail
          trap 'status=$?; echo "::error::Release verification failed at workflow line $LINENO (exit $status)"; exit "$status"' ERR
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          EXPECTED_CERT="b3bbf7520e77dfc384a60b1eee6c5f205b978f9b453849e2be523f642018d263"
          for apk in "$RELEASE_APK"; do
            echo "Checking APK exists: $apk"
            if [[ ! -f "$apk" ]]; then
              echo "::error::Expected APK was not produced: $apk"
              ls -lah app/build/outputs/apk/{debug,release}/ || true
              exit 1
            fi
            ls -lh "$apk"
            echo "Checking native ABI contents: $apk"
            python3 - "$apk" <<'PY'
          import sys, zipfile
          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as archive:
              abis = {
                  name.split("/")[1]
                  for name in archive.namelist()
                  if name.startswith("lib/") and name.endswith(".so") and len(name.split("/")) > 2
              }
              print(f"{apk}: packaged ABIs = {sorted(abis)}")
              if abis != {"arm64-v8a"}:
                  raise SystemExit(f"{apk}: expected arm64-v8a only, got {sorted(abis)}")
          PY
          done
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          echo "Checking apksigner executable: $APKSIGNER"
          if [[ ! -x "$APKSIGNER" ]]; then
            echo "::error::apksigner is missing or not executable"
            ls -lah "$ANDROID_HOME/build-tools/" || true
            exit 1
          fi
          echo "Verifying release APK signature"
          "$APKSIGNER" verify --verbose "$RELEASE_APK"
          echo "Reading release certificate fingerprint"
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$RELEASE_APK")"
          echo "$CERT_OUTPUT"
          CERT_DIGEST="$(printf '%s\n' "$CERT_OUTPUT" | awk '/certificate SHA-256 digest:/ {sub(/^.*certificate SHA-256 digest: /, ""); print tolower($0); exit}')"
          echo "Actual release certificate SHA-256: ${CERT_DIGEST:-<missing>}"
          echo "Expected release certificate SHA-256: $EXPECTED_CERT"
          if [[ "$CERT_DIGEST" != "$EXPECTED_CERT" ]]; then
            echo "::error::Release APK certificate does not match the established LastHaven release key."
            exit 1
          fi
          python3 - <<'PY'
          import os, zipfile
          apks = ["app/build/outputs/apk/release/app-release.apk"]
          summary = ["| APK | File size | DEX payload |", "|---|---:|---:|"]
          for apk in apks:
              with zipfile.ZipFile(apk) as archive:
                  dex_bytes = sum(
                      item.compress_size for item in archive.infolist()
                      if item.filename.endswith(".dex")
                  )
              size = os.path.getsize(apk)
              summary.append(
                  f"| {os.path.basename(os.path.dirname(apk))} | {size:,} bytes ({size / 1024 / 1024:.1f} MiB) | {dex_bytes / 1024 / 1024:.1f} MiB |"
              )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as report:
              report.write("\n## APK size report\n\n" + "\n".join(summary) + "\n")
          PY

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: lasthavenplus-release-signed-arm64
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Generate and verify differential release package
        if: steps.version.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.code }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          # The full signed APK is the required release payload. Differential
          # generation is an optimization and must never block that payload.
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk release-assets/lasthavenplus-arm64.apk
          TARGET_APK="release-assets/lasthavenplus-arm64.apk"
          TARGET_SHA="$(sha256sum "$TARGET_APK" | awk '{print $1}')"
          TARGET_SIZE="$(stat -c '%s' "$TARGET_APK")"
          PATCH_JSON="null"
          RELEASES_JSON="$RUNNER_TEMP/releases.json"
          PATCH_TOOLS_READY=false

          # Bound both API latency and bytes before parsing untrusted release metadata.
          if timeout 45s gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" | \
            python3 .github/scripts/bounded_release_input.py --stdin - "$RELEASES_JSON" 4194304; then
            if jq -e 'type == "array"' "$RELEASES_JSON" >/dev/null 2>&1; then
              PREVIOUS_RELEASE="$(jq -c --arg current "$RELEASE_TAG" \
                '[.[] | select(.draft == false and .prerelease == false and .tag_name != $current)][0] // empty' \
                "$RELEASES_JSON")"
            else
              echo "::warning::Previous-release API returned malformed data; publishing the full APK only."
              PREVIOUS_RELEASE=""
            fi
          else
            echo "::warning::Previous-release API lookup failed, timed out or exceeded 4 MiB; publishing the full APK only."
            PREVIOUS_RELEASE=""
          fi

          if [[ -n "$PREVIOUS_RELEASE" ]]; then
            PREVIOUS_TAG="$(jq -r '.tag_name // empty' <<< "$PREVIOUS_RELEASE")"
            PREVIOUS_APK_URL="$(jq -r '.assets[]? | select(.name == "lasthavenplus-arm64.apk") | .browser_download_url' <<< "$PREVIOUS_RELEASE" | head -n 1)"
            PREVIOUS_MANIFEST_URL="$(jq -r '.assets[]? | select(.name == "lasthavenplus-update.json") | .browser_download_url' <<< "$PREVIOUS_RELEASE" | head -n 1)"

            if [[ "$PREVIOUS_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ &&
              -n "$PREVIOUS_APK_URL" && "$PREVIOUS_APK_URL" != "null" &&
              -n "$PREVIOUS_MANIFEST_URL" && "$PREVIOUS_MANIFEST_URL" != "null" ]]; then
              # Release asset downloads are streamed and hard-capped even if Content-Length is absent.
              if timeout 90s python3 .github/scripts/bounded_release_input.py "$PREVIOUS_APK_URL" "$RUNNER_TEMP/previous.apk" 268435456 &&
                timeout 30s python3 .github/scripts/bounded_release_input.py "$PREVIOUS_MANIFEST_URL" "$RUNNER_TEMP/previous-manifest.json" 1048576; then

                BASE_VERSION="$(jq -r '.version // empty' "$RUNNER_TEMP/previous-manifest.json" 2>/dev/null || true)"
                BASE_VERSION_CODE="$(jq -r '.versionCode // empty' "$RUNNER_TEMP/previous-manifest.json" 2>/dev/null || true)"
                BASE_EXPECTED_SHA="$(jq -r '.apk.sha256 // empty' "$RUNNER_TEMP/previous-manifest.json" 2>/dev/null || true)"
                BASE_SHA="$(sha256sum "$RUNNER_TEMP/previous.apk" 2>/dev/null | awk '{print $1}' || true)"

                if [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ &&
                  "$PREVIOUS_TAG" == "v$BASE_VERSION" &&
                  "$BASE_VERSION_CODE" =~ ^[0-9]+$ &&
                  "$BASE_EXPECTED_SHA" =~ ^[0-9a-fA-F]{64}$ &&
                  "$BASE_SHA" =~ ^[0-9a-fA-F]{64}$ &&
                  "$BASE_SHA" == "$BASE_EXPECTED_SHA" ]]; then

                  BASE_CERT_OUTPUT="$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$RUNNER_TEMP/previous.apk" 2>/dev/null || true)"
                  BASE_CERT_DIGEST="$(printf '%s\n' "$BASE_CERT_OUTPUT" | awk '/certificate SHA-256 digest:/ {sub(/^.*certificate SHA-256 digest: /, ""); print tolower($0); exit}')"

                  if [[ "$BASE_CERT_DIGEST" == "b3bbf7520e77dfc384a60b1eee6c5f205b978f9b453849e2be523f642018d263" ]]; then
                    # Install the optional patch tools only after a compatible
                    # base release is confirmed. Both package operations are bounded.
                    if command -v bsdiff >/dev/null 2>&1 && command -v bspatch >/dev/null 2>&1; then
                      PATCH_TOOLS_READY=true
                    elif timeout 120s sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 &&
                      timeout 90s sudo apt-get install -y --no-install-recommends bsdiff; then
                      PATCH_TOOLS_READY=true
                    else
                      echo "::warning::Could not install bsdiff within the time limit; publishing the full APK only."
                    fi

                    if [[ "$PATCH_TOOLS_READY" == true ]]; then
                      PATCH_NAME="lasthavenplus-arm64-${PREVIOUS_TAG}-to-${RELEASE_TAG}.bsdiff"
                      if timeout 120s bsdiff "$RUNNER_TEMP/previous.apk" "$TARGET_APK" "$RUNNER_TEMP/update.bsdiff" &&
                        timeout 60s bspatch "$RUNNER_TEMP/previous.apk" "$RUNNER_TEMP/reconstructed.apk" "$RUNNER_TEMP/update.bsdiff" &&
                        [[ "$(sha256sum "$RUNNER_TEMP/reconstructed.apk" | awk '{print $1}')" == "$TARGET_SHA" ]]; then
                        if PATCH_SIZE="$(stat -c '%s' "$RUNNER_TEMP/update.bsdiff" 2>/dev/null)" &&
                          [[ "$PATCH_SIZE" =~ ^[0-9]+$ ]] &&
                          (( PATCH_SIZE > 0 && PATCH_SIZE * 10 < TARGET_SIZE * 9 )); then
                          if cp "$RUNNER_TEMP/update.bsdiff" "release-assets/$PATCH_NAME" &&
                            PATCH_SHA="$(sha256sum "release-assets/$PATCH_NAME" 2>/dev/null | awk '{print $1}')" &&
                            [[ "$PATCH_SHA" =~ ^[0-9a-fA-F]{64}$ ]] &&
                            PATCH_JSON="$(jq -n \
                              --arg name "$PATCH_NAME" \
                              --arg fromVersion "$BASE_VERSION" \
                              --arg fromSha256 "$BASE_SHA" \
                              --arg sha256 "$PATCH_SHA" \
                              --argjson fromVersionCode "$BASE_VERSION_CODE" \
                              --argjson size "$PATCH_SIZE" \
                              '{name:$name, fromVersion:$fromVersion, fromVersionCode:$fromVersionCode, fromSha256:$fromSha256, sha256:$sha256, size:$size}')"; then
                            echo "Verified differential patch: $PATCH_SIZE bytes versus $TARGET_SIZE-byte full APK."
                          else
                            rm -f "release-assets/$PATCH_NAME"
                            PATCH_JSON="null"
                            echo "::warning::Could not stage or describe the optional differential patch; publishing full APK only."
                          fi
                        else
                          echo "Differential patch is not at least 10% smaller or its size could not be verified; publishing full APK only."
                        fi
                      else
                        echo "::warning::Differential patch generation or reconstruction failed; publishing full APK only."
                      fi
                    fi
                  else
                    echo "Previous release signing certificate differs or is invalid; skipping differential patch."
                  fi
                else
                  echo "Previous release manifest or APK digest is invalid; skipping differential patch."
                fi
              else
                echo "::warning::Could not download the previous release within the time limit; publishing full APK only."
              fi
            else
              echo "Previous release has no compatible APK and manifest; publishing full APK only."
            fi
          else
            echo "No previous stable release was found; publishing full APK only."
          fi

          # This manifest is always produced, including every delta fallback path.
          jq -n \
            --arg version "$RELEASE_VERSION" \
            --argjson versionCode "$RELEASE_VERSION_CODE" \
            --arg apkSha "$TARGET_SHA" \
            --argjson apkSize "$TARGET_SIZE" \
            --argjson patch "$PATCH_JSON" \
            '{schemaVersion:1, version:$version, versionCode:$versionCode, apk:{name:"lasthavenplus-arm64.apk", sha256:$apkSha, size:$apkSize}, patch:$patch}' \
            > release-assets/lasthavenplus-update.json

          test -s release-assets/lasthavenplus-arm64.apk
          test -s release-assets/lasthavenplus-update.json
          echo "Release payload ready: full APK and update manifest."
      - name: Remove legacy duplicate release assets
        if: steps.version.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>/dev/null || true)"
          if [[ -z "$release_json" ]]; then
            echo "No existing draft release; nothing to clean."
            exit 0
          fi
          release_id="$(jq -r '.id' <<< "$release_json")"
          while IFS= read -r asset_id; do
            [[ -n "$asset_id" ]] || continue
            echo "Deleting stale legacy asset ID $asset_id"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done < <(jq -r '.assets[] | select(.name == "lasthavenlauncher-arm64.apk" or .name == "lasthavenlauncher-update.json") | .id' <<< "$release_json")

      - name: Publish signed release and update assets
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          draft: true
          files: release-assets/*
          fail_on_unmatched_files: true

      - name: Verify final draft contains exactly one APK
        if: steps.version.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/final-release.json"
          jq -e '
            ([.assets[] | select(.name | endswith(".apk"))] | length) == 1 and
            ([.assets[] | select(.name == "lasthavenplus-arm64.apk")] | length) == 1 and
            ([.assets[] | select(.name == "lasthavenplus-update.json")] | length) == 1 and
            ([.assets[] | select(.name == "lasthavenlauncher-arm64.apk" or .name == "lasthavenlauncher-update.json")] | length) == 0
          ' "$RUNNER_TEMP/final-release.json" >/dev/null || {
            echo "::error::Draft release must contain exactly one APK (lasthavenplus-arm64.apk), one update manifest, and no legacy launcher assets."
            jq -r '.assets[].name' "$RUNNER_TEMP/final-release.json"
            exit 1
          }
          echo "Verified: exactly one APK and one canonical update manifest."
