name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 37 platform
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build debug APK
        run: gradle assembleDebug testDebugUnitTest --no-daemon --stacktrace

      - name: Verify APK ABI
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | tee apk-contents.txt
          if grep -E 'lib/(x86|x86_64|armeabi-v7a)/' apk-contents.txt; then
            echo "Unexpected non-arm64 native library found"
            exit 1
          fi
          grep -q 'lib/arm64-v8a/' apk-contents.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lasthavenlauncher-debug-arm64
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
