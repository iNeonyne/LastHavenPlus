name: Temporary Addon Manager formatter assist

on:
  pull_request:
    branches: [beta]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
      - name: Set up Gradle Wrapper
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          gradle-version: wrapper
          validate-wrappers: true
      - name: Apply repository Kotlin formatting
        run: ./gradlew spotlessApply --stacktrace
      - name: Upload formatted files for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: temporary-spotless-152-${{ github.sha }}
          path: |
            app/src/main/java/com/neonyne/lasthavenlauncher/AddonLibraryRepository.kt
            app/src/test/java/com/neonyne/lasthavenlauncher/AddonLibraryRepositoryTest.kt
          retention-days: 1
