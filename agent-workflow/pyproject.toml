[project]
name = "issue-agent"
version = "0.1.0"
description = "Scheduled GitHub issue agent for LastHavenPlus: picks up agent:fix issues and opens draft PRs against beta"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mistralai>=3.6.0",
    "mistralai-workflows[mistralai]>=3.17.1",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25.3",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "issue_agent"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
