<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lasthavens Addon Manager</title>
    <link rel="stylesheet" href="manager.css" />
  </head>
  <body>
    <main>
      <header class="app-header">
        <div class="brand-lockup">
          <img class="app-icon" src="icon-96.png" alt="" width="56" height="56" />
          <div class="brand-copy">
            <div class="topbar">
              <span class="eyebrow">LASTHAVENS · WOTLK 3.3.5a <span id="version"></span></span>
            </div>
            <h1 data-i18n="title"></h1>
          </div>
        </div>
        <select id="language" aria-label="Language"></select>
      </header>
      <nav class="tabs" role="tablist">
        <button id="tab-mine" role="tab" aria-selected="true" data-i18n="tabMine"></button
        ><button id="tab-browse" role="tab" aria-selected="false" data-i18n="tabBrowse"></button>
      </nav>
      <div id="message" role="status" aria-live="polite"></div>
      <div id="view-mine">
      <section class="toolbar">
        <label class="primary"
          ><span data-i18n="importZip"></span
          ><input
            id="import"
            type="file"
            accept=".zip,application/zip"
            multiple
            hidden /></label
        ><button id="scan" data-i18n="scanAddons"></button>
        <button id="update-all" data-i18n="updateAll"></button>
        <button id="backup" data-i18n="backup"></button>
        <label class="secondary"><span data-i18n="restore"></span><input id="restore" type="file" accept=".zip,application/zip" hidden /></label>
        <button id="play" data-i18n="play"></button>
      </section>
      <p class="hint" data-i18n="managementHint"></p>
      <p class="hint" data-i18n="backupScope"></p>
      <section class="dashboard" aria-label="Addon overview">
        <div class="stat"><span data-i18n="installedStat"></span><strong id="stat-installed">0</strong></div>
        <div class="stat"><span data-i18n="updatesStat"></span><strong id="stat-updates">0</strong></div>
        <div class="stat"><span data-i18n="availableStat"></span><strong id="stat-available">—</strong></div>
      </section>
      <div id="progress-wrap" hidden><progress></progress><span id="progress-label"></span></div>
      <details id="error-panel" hidden><summary data-i18n="errorLog"></summary><pre id="error-text"></pre><button id="copy-errors" data-i18n="copyErrors"></button></details>
      <div id="perm" hidden>
        <p class="warning" data-i18n="permNeeded"></p>
        <button id="grant" data-i18n="permGrant"></button>
      </div>
      <p class="hint" data-i18n="hint"></p>
      <p id="seen" class="hint"></p>
      <label class="check"
        ><input id="badge" type="checkbox" /><span data-i18n="badgeLabel"></span
      ></label>
      <p class="hint" data-i18n="badgeHint"></p>
      <section class="summary">
        <strong id="count"></strong><span id="status"></span>
      </section>
      <div id="list"></div>
      <section class="footer">
        <h2 data-i18n="storageTitle"></h2>
        <p data-i18n="storageInfo"></p>
        <p data-i18n="limits"></p>
        <p data-i18n="reloadInfo"></p>
      </section>
      </div>
      <div id="view-browse" hidden>
        <div id="bperm" hidden>
          <p class="warning" data-i18n="browsePerm"></p>
          <button id="bgrant" data-i18n="browseGrant"></button>
        </div>
        <div id="bmain" hidden>
          <div class="browse-bar">
            <input id="bsearch" type="search" data-i18n-placeholder="searchPlaceholder" autocomplete="off" />
            <select id="bcat" aria-label="Category"></select>
            <select id="bfilter" aria-label="Addon status"></select>
            <button id="brefresh" data-i18n="refresh"></button>
          </div>
          <p id="bstatus" class="hint"></p>
          <div id="blist"></div>
        </div>
      </div>
    </main>
    <dialog id="remove-dialog" class="confirm-dialog" aria-labelledby="remove-title">
      <form method="dialog">
        <p class="eyebrow" data-i18n="removeAddonEyebrow"></p>
        <h2 id="remove-title" data-i18n="removeAddonTitle"></h2>
        <p id="remove-description" class="dialog-copy"></p>
        <label class="backup-option"><input id="remove-backup" type="checkbox" checked /><span data-i18n="backupBeforeRemove"></span></label>
        <p class="dialog-note" data-i18n="settingsPreservedNote"></p>
        <div class="dialog-actions">
          <button value="cancel" data-i18n="cancel"></button>
          <button value="remove" class="danger" data-i18n="remove"></button>
        </div>
      </form>
    </dialog>
    <script type="module" src="manager.js"></script>
  </body>
</html>
